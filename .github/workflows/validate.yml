name: Validate extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest and JavaScript
        run: node scripts/validate-extension.mjs

      - name: Build distributable ZIP
        run: bash scripts/package-extension.sh

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dola-downloader-extension
          path: dist/dola-downloader-extension.zip
